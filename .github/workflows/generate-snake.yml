name: Generate Snake Game

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake Animation (Light)
        uses: Platane/snk@v3
        with:
          github_user_name: Enas-Khaled
          outputs: |
            github-contribution-grid-snake.svg

      - name: Generate Snake Animation (Dark)
        uses: Platane/snk@v3
        with:
          github_user_name: Enas-Khaled
          outputs: |
            github-contribution-grid-snake-dark.svg
          args: "--palette github-dark"

      - name: Commit and push generated SVGs
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg || true
          git diff --cached --quiet || git commit -m "Update snake animations"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
