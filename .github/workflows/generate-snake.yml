name: Generate Snake Game

on:
  workflow_dispatch:  # allows manual trigger
  schedule:
    - cron: '0 0 * * *'  # optional daily run

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Enas-Khaled   # <-- your GitHub username
          outputs: |
            github-contribution-grid-snake.svg

     - name: Commit and push generated SVG
       run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add github-contribution-grid-snake.svg || true
          git diff --cached --quiet || git commit -m "Update snake animation"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
