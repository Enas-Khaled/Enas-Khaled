name: Generate Snake Game

on:
  workflow_dispatch:      # allows manual run from Actions tab
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight (UTC)

permissions:
  contents: write         # ✅ allow push access to repo

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake Animation (Light)
        uses: Platane/snk@v3
        with:
          github_user_name: Enas-Khaled
          outputs: |
            github-contribution-grid-snake.svg

      - name: Commit and push generated SVG
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add github-contribution-grid-snake.svg || true
          git diff --cached --quiet || git commit -m "Update snake animation"
          git push
